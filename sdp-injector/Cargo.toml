[package]
name = "sdp-injector"
version = "1.4.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "sdp-injector"
test = true
bench = false

[dependencies]
sdp-macros = { path = "../sdp-macros" }
sdp-common = { path = "../sdp-common" }
sdp-test-macros = { path = "../sdp-test-macros" }

tokio = { version = "~1.53.1", features = ["rt", "macros", "rt-multi-thread", "net"] }
hyper = { version = "1.6", features = ["server", "http1"]}
hyper-util = { version = "0.1", features = ["server", "tokio", "http1"] }
http-body-util = "0.1"
tls-listener = { version = "0.11",  features = [ "rustls-ring", "tokio-net", "rt" ] }
tokio-rustls = { version = "0.26", features = ["ring"], default-features = false }
serde_json = "1.0"
serde = { version= "1.0", features = ["derive"] }
kube = { version = "4.0.0", default-features = false, features = ["admission", "rustls-tls", "derive", "client", "runtime"] }
k8s-openapi = { version = "0.28.0", features = ["latest"]}
rustls = { version = "0.23", features = ["ring"], default-features = false }
rustls-pemfile = "2.2"
futures-util = "0.3"
http = "1.4.2"
log = "0.4.21"
json-patch = "4.2.0"
uuid = { version = "1.6.1", features = ["v4", "fast-rng"] }
futures = "0.3.30"
log4rs = "1.2.0"
notify = { version = "6.1.1", default-features = false, features=["macos_kqueue"] }
async-trait = "0.1.80"
